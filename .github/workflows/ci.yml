name: Banking System CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start Banking API
        run: |
          mvn -DskipTests spring-boot:run > spring-boot.log 2>&1 &
          echo $! > spring-boot.pid

      - name: Wait for Banking API
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/accounts || true)
          
            echo "Attempt $i: HTTP $STATUS"
          
            if [ "$STATUS" = "200" ]; then
              echo "Banking API is ready"
              exit 0
            fi
          
            sleep 2
          done
          
          echo "Banking API failed to become ready"
          cat spring-boot.log
          exit 1

      - name: Run tests
        run: |
          mvn --batch-mode test \
            -Dheadless=true \
            -Dbrowser=chrome

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-artifacts
          path: |
            target/screenshots/
            target/surefire-reports/
            spring-boot.log
          if-no-files-found: ignore

      - name: Stop Banking API
        if: always()
        run: |
          if [ -f spring-boot.pid ]; then
            kill $(cat spring-boot.pid) || true
          fi